name: Data Pipeline Dportenis

on:
  schedule:
    # Se ejecuta en el minuto 0 cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # Este botón permite ejecutarlo manualmente desde GitHub

jobs:
  extraccion_y_carga:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Extracción del Clima
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python openmeteo.py

      - name: Ejecutar Extracción de Trends
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python googletrends.py
